  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
 <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="./indexJP.html"><img src="./assets/img/logo.png" href="/public/index.html"></a>
            </div>
            <div class="header-right">
                <nav class="header-menu">
                    <a href="./indexJP.html#sobre">概要</a>
                    <a href="./indexJP.html#onsens">温泉</a>
                    <a href="./indexJP.html#jigokumushi">地獄むし</a>
                    <a href="./indexJP.html#jigokumeguri">地獄めぐり</a>
                </nav>
                <div class="header-actions">
                    <a class="btn-outline" href="./loginJP.html">ログイン</a>
                    <a class="btn-primary" href="./cadastroJP.html">登録</a>


                    <div class="lang-switch">
                        <a href="./cadastro.html">PT</a> |
                        <a href="./cadastroJP.html">JP</a>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </header>

  <div class="body-cadastro">
    <div class="cadastro">
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>
      <div class="container">
        <div class="card card-cadastro">
          <h2>ようこそ!</h2>
          <div class="formulario">
            <div class="campo">
              <span>名前:</span>
              <input id="nome_input" type="text" placeholder="名前" />
            </div>
            <div class="campo">
              <span>メール:</span>
              <input id="email_input" type="text" placeholder="あなたのメール＠メール.com" />
            </div>
            <div class="campo">
              <span>パスワード:</span>
              <input id="senha_input" type="password" placeholder="******" />
            </div>
            <div class="campo">
              <span>パスワード確認:</span>
              <input id="confirmacao_senha_input" type="password" placeholder="******" />
            </div>
            <button class="botao" onclick="cadastrar()">登録</button>
          </div>

          <div id="div_erros_login"></div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>

<script>
  function cadastrar() {
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;


    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "すべての項目を正しく入力してください!";

      finalizarAguardar();
      return false;
    } else if (nomeVar.length < 1) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "名前は2文字以上で入力してください";

        limparFormulario();
      return false;
    } else if (!(emailVar.includes('@') || emailVar.includes('.'))) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "メールアドレスには「@」と「.」を含めてください";

        limparFormulario();
      return false;
    } else if (senhaVar.length < 8 ||
      !(senhaVar.includes('@') || 
        senhaVar.includes('!') ||
        senhaVar.includes('#') ||
        senhaVar.includes('%') ||
        senhaVar.includes('&') ||
        senhaVar.includes('*'))
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "パスワードは8文字以上で、記号を少なくとも1つ含めてください";
          limparFormulario();
      return false;
    } else if (senhaVar != confirmacaoSenhaVar) 
      {
       cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "パスワードが一致しません";

          limparFormulario();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
          limparFormulario();
    }

    function limparFormulario() {
      nome_input.value = '';
      email_input.value = '';
      senha_input.value = '';
      confirmacao_senha_input.value = '';
    }


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "登録が正常に完了しました！ログイン画面へリダイレクトしています…";

          setTimeout(() => {
            window.location = "loginJP.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          alert(`登録中にエラーが発生しました！`);
          limparFormulario();  
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        alert(`登録中にエラーが発生しました！`)
        limparFormulario();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beppu | Quiz</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/logo_img.png">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/quiz.css">
</head>


<body onload="onloadEsconder()">
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="./index.html"><img src="./assets/img/logo.png" href="./index.html"></a>
            </div>

            <div class="header-right">
                <nav class="header-menu">
                    <a href="./dashboard/dashboard.html">Dashboard</a>
                </nav>

                <div class="header-actions">
                    <a class="btn-outline" href="../home.html">Voltar</a>


                    <div class="lang-switch">
                        <a href="./quiz.html">PT</a> |
                        <a href="./quizJP.html">JP</a>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <div class="quiz-wrapper">
        <div class="quiz-start">
            <h1>Quiz sobre Beppu</h1>
            <p>Teste seus conhecimentos e veja o quanto você está apto para visitar a cidade dos onsens!</p>

            <button id="btnIniciarQuiz" onclick="iniciarQuiz()">
                Começar Quiz
            </button>
        </div>
    </div>
    <div id="pontuacao" class="quiz-score">
        <div class="score-item">
            <span>Acertos</span>
            <strong id="spanCertas">0</strong>
        </div>

        <div class="score-item">
            <span>Erros</span>
            <strong id="spanErradas">0</strong>
        </div>

        <div class="score-item destaque">
            <span>Pontuação</span>
            <strong id="spanPontuacaoFinal">0</strong>
        </div>
    </div>

    <div id="msgFinal"></div>

    <div id="jogo" class="quiz-container">

        <div class="quiz-topo">
            <div id="infoQuestao">
                Questão <span id="spanNumeroDaQuestaoAtual"></span> de
                <span id="qtdQuestoes"></span>
            </div>

            <div id="perguntaDaQuestaoAtual">
                <span id="spanQuestaoExibida"></span>
            </div>

            <div id="infoAlternativas">
                <em>Escolha uma opção:</em>
            </div>
        </div>

        <div id="opcoes" class="quiz-opcoes">
            <div class="opcao-item">
                <input type="radio" id="primeiraOpcao" name="option" value="alternativaA">
                <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
            </div>

            <div class="opcao-item">
                <input type="radio" id="segundaOpcao" name="option" value="alternativaB">
                <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
            </div>

            <div class="opcao-item">
                <input type="radio" id="terceiraOpcao" name="option" value="alternativaC">
                <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
            </div>

            <div class="opcao-item">
                <input type="radio" id="quartaOpcao" name="option" value="alternativaD">
                <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
            </div>
        </div>

        <div id="botoes" class="quiz-botoes">
            <button onclick="submeter()" id="btnSubmeter">Submeter</button>
        </div>

    </div>
</body>

</html>
<script>
    if (sessionStorage.ID_USUARIO == undefined) {
        alert("Você precisa estar logado para acessar o quiz!");

        window.location = "login.html";
    }
    const listaDeQuestoes = [
        {
            pergunta: "O que são os onsen em Beppu?",
            alternativaA: "Piscinas termais artificiais",
            alternativaB: "Fontes termais naturais",
            alternativaC: "Lagos artificiais",
            alternativaD: "Águas cristalinas",
            alternativaCorreta: "alternativaB"
        },

        {
            pergunta: "O que é o 'Jigoku Meguri' em Beppu?",
            alternativaA: "Festival de comida",
            alternativaB: "Passeio pelos 'infernos' termais",
            alternativaC: "Templo histórico",
            alternativaD: "Tipo de hospedagem",
            alternativaCorreta: "alternativaB"
        },

        {
            pergunta: "Dentre os 'Jigoku Meguri' de Beppu, qual deses é designado como 'Sítio da Beleza Cênica Nacional' e apresenta águas de cor azul?",
            alternativaA: "Tatsumaki Jigoku",
            alternativaB: "Oniishibozu Jigoku",
            alternativaC: "Umi Jigoku",
            alternativaD: "Chinoike Jigoku",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "O 'Umi Jigoku' atinge aproximadamente quantos graus?",
            alternativaA: "80°C",
            alternativaB: "90°C",
            alternativaC: "100°C",
            alternativaD: "110°C",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "O 'Chinoike Jigoku' é famoso por sua coloração avermelhada. Históricamente, para qual finalidade a 'lama' rica em óxido de ferro era utilizada?",
            alternativaA: "Combustível para fornos",
            alternativaB: "Purificação de água potável",
            alternativaC: "Fertilizante para arrozais",
            alternativaD: "Pomadas medicinais para doenças de pele",
            alternativaCorreta: "alternativaD"
        },

        {
            pergunta: "Qual prato típico de Beppu é cozido com vapor dos onsen?",
            alternativaA: "Jigoku Sushi",
            alternativaB: "Jigoku Tempura",
            alternativaC: "Jigoku Mushi",
            alternativaD: "Jigoku Ramen",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "O 'Jigoku Mushi' utiliza o vapor direto das fontes termais para cozinhar. Além da temperatura, qual característica do vapor de Beppu influencia o sabor final dos alimentos?",
            alternativaA: "A ausência total de umidade do vapor vulcânico",
            alternativaB: "A presença de gás carbônico purificado",
            alternativaC: "Os sais minerais e o cloreto de sódio presentes no vapor",
            alternativaD: "O alto teor de nitrogênio atmosférico",
            alternativaCorreta: "alternativaC"
        },

        {
            pergunta: "Beppu está localizada em qual região do Japão?",
            alternativaA: "Hokkaido",
            alternativaB: "Kyushu",
            alternativaC: "Kanto",
            alternativaD: "Kansai",
            alternativaCorreta: "alternativaB"
        },

        {
            pergunta: "O que torna o Tatsumaki Jigoku uma das atrações mais conhecidas de Beppu?",
            alternativaA: "Seu gêiser natural que lança vapor e água quente",
            alternativaB: "Suas águas azul-cobalto",
            alternativaC: "Sua lama medicinal vermelha",
            alternativaD: "Seu lago congelado durante o inverno",
            alternativaCorreta: "alternativaA"
        },

        {
            pergunta: "Qual é a principal característica do Oniishibozu Jigoku em Beppu?",
            alternativaA: "Águas azul-cobalto",
            alternativaB: "Lama quente cinzenta que borbulha",
            alternativaC: "Um gêiser natural",
            alternativaD: "Águas avermelhadas ricas em ferro",
            alternativaCorreta: "alternativaB"
        },

    ]

    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"
        document.querySelector('.quiz-wrapper').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1;
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function submeter() {
        const options = document.getElementsByName("option");

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true

            habilitarAlternativas(false)

            checarResposta()

            setTimeout(() => {
                avancar()
            }, 900)
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }

    function avancar() {
        numeroDaQuestaoAtual++
        btnSubmeter.disabled = false

        desmarcarRadioButtons()
        limparCoresBackgroundOpcoes()

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]
        const respostaCorreta = questaoAtual.alternativaCorreta

        const options = document.getElementsByName("option")

        let alternativaCorretaId = null
        let alternativaSelecionada = null

        options.forEach((option) => {
            if (option.value === respostaCorreta) {
                alternativaCorretaId = option.labels[0].id
            }

            if (option.checked) {
                alternativaSelecionada = option
            }
        })

        if (alternativaSelecionada.value === respostaCorreta) {
            document.getElementById(alternativaCorretaId).classList.add("text-success-with-bg")
            pontuacaoFinal++
            certas++
            document.getElementById("spanCertas").innerHTML = certas
        } else {
            const wrongId = alternativaSelecionada.labels[0].id

            document.getElementById(wrongId).classList.add("text-danger-with-bg")
            document.getElementById(alternativaCorretaId).classList.add("text-success-with-bg")

            erradas++
            document.getElementById("spanErradas").innerHTML = erradas
        }
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        let textoParaMensagemFinal = null
        let classComCoresParaMensagemFinal = null
        const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

        textoParaMensagemFinal = "クイズ終了！<br> あなたは問題の " + Math.round((porcentagemFinalDeAcertos) * 100) + "% に正解しました。"


        document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
        document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal)
        document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

        let porcentagem = ((pontuacaoFinal / quantidadeDeQuestoes) * 100).toFixed(2);

        fetch("/quiz/salvar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                pontuacaoServer: pontuacaoFinal,
                acertosServer: certas,
                errosServer: erradas,
                porcentagemServer: porcentagem,
                fkUsuarioServer: Number(sessionStorage.ID_USUARIO)

            })

        })
            .then(function (resposta) {

                console.log("Resultado salvo!");

                setTimeout(() => {
                    window.location = "./dashboard/dashboard.html";
                }, 2000);

            })
            .catch(function (erro) {

                console.log("Erro ao salvar:", erro);

            });

        document.getElementById('jogo').classList.add("text-new-gray")
        btnSubmeter.disabled = true
    }
</script>

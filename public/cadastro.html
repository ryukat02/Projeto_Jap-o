<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beppu | Cadastro</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/logo_img.png">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <a href="./index.html"><img src="./assets/img/logo.png" href="./index.html"></a>
    </div>

    <div class="right">
      <nav class="menu">
        <a href="./index.html#sobre">Sobre</a>
        <a href="./index.html#cultura">Cultura</a>
        <a href="./index.html#onsens">Onsens</a>
        <a href="./index.html#turismo">Turismo</a>
      </nav>

      <div class="acoes">
        <a class="btn-outline" href="./login.html">Entrar</a>
        <a class="btn-primary" href="./cadastro.html">Cadastrar</a>
      </div>

      <div class="lang-switch">
        <a href="./cadastro.html">PT</a> |
        <a href="./cadastroJP.html">JP</a>
      </div>
    </div>
  </header>

  <div class="body-cadastro">
    <div class="login">
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>
      <div class="container">
        <div class="card card-cadastro">
          <h2>Bem-vindo!</h2>
          <div class="formulario">
            <div class="campo">
              <span>Nome:</span>
              <input id="nome_input" type="text" placeholder="Seu nome" />
            </div>
            <div class="campo">
              <span>E-mail:</span>
              <input id="email_input" type="text" placeholder="seuemail@email.com" />
            </div>
            <div class="campo">
              <span>Senha:</span>
              <input id="senha_input" type="password" placeholder="******" />
            </div>
            <div class="campo">
              <span>Confirmação da Senha:</span>
              <input id="confirmacao_senha_input" type="password" placeholder="******" />
            </div>
            <button class="botao" onclick="cadastrar()">Cadastrar</button>
          </div>

          <div id="div_erros_login"></div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>

<script>
  function cadastrar() {
    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;


    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "Preencha corretamente todos os campos!";

      finalizarAguardar();
      return false;
    } else if (nomeVar.length < 1) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "O campo nome deve conter mais de 1 caractere";

      finalizarAguardar();
      return false;
    } else if (!(emailVar.includes('@') || emailVar.includes('.'))) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "O E-mail deve conter '@' e '.'";

      finalizarAguardar();
      return false;
    } else if (senhaVar.length <= 8 ||
      !(senhaVar.includes('@') ||
        senhaVar.includes('!') ||
        senhaVar.includes('#') ||
        senhaVar.includes('%') ||
        senhaVar.includes('&') ||
        senhaVar.includes('*'))
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "A senha deve conter pelo menos 8 caracteres e pelo menos 1 caractere especial!";
      finalizarAguardar();
      return false;
    } else if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "As senhas devem ser iguais";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }


    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        cardErro.style.display = "block";
        mensagem_erro.innerHTML =
          "Houve um erro ao tentar realizar o cadastro";
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beppu | Dashboard</title>

    <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/logo_img.png">

    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao(), buscarDados()">

    <header class="header dashboard-header">
        <div class="header-content">
        <div class="header-logo">
            <img src="../assets/img/logo.png">
        </div>

        <div class="header-right">
            <nav class="header-menu">
                <a href="../quiz.html">Quiz</a>
            </nav>

            <div class="header-actions">
                <a class="btn-outline" href="../home.html">Voltar</a>

                <div class="lang-switch">
                    <a href="./dashboard.html">PT</a> |
                    <a href="./dashboardJP.html">JP</a>
                </div>
            </div>
        </div>
        </div>
    </header>

    <div class="dashboard">

        <h1>
            Olá, <span id="b_usuario"></span> 👋
        </h1>

        <div class="kpis">

            <div class="card-kpi">
                <h2>Total de Quizzes Realizados</h2>
                <p id="kpiQuiz">0</p>
            </div>

            <div class="card-kpi">
                <h2>Maior Pontuação</h2>
                <p id="kpiPontuacao">0</p>
            </div>

            <div class="card-kpi">
                <h2>Média de Acertos</h2>
                <p id="kpiMedia">0%</p>
            </div>

            <div class="card-kpi nivel-card">
                <h2>Nível</h2>
                <p id="perfilNivel">-</p>
            </div>

            <div class="card-kpi titulo-card">
                <h2>Título</h2>
                <p id="perfilTitulo">-</p>
            </div>

        </div>

        <div class="grafico">
            <canvas id="graficoQuiz">Realize o Quiz para ver sua Pontuação</canvas>
        </div>

        <div class="grafico">
            <canvas id="graficoRanking"></canvas>
        </div>

    </div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function buscarDados() {

        fetch(`/quiz/dashboard/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {

                resposta.json().then(function (dados) {

                    console.log(dados);

                    kpiQuiz.innerHTML = dados.totalQuiz;
                    kpiPontuacao.innerHTML = dados.maiorPontuacao;
                    kpiMedia.innerHTML = Number(dados.media).toFixed() + "%";
                    perfilNivel.innerHTML = dados.nivel;
                    perfilTitulo.innerHTML = dados.titulo;

                    plotarGrafico(dados.listaPontuacoes);
                    plotarRanking(dados.rankingUsuarios);

                });

            });

    }

    function plotarGrafico(listaPontuacoes) {

        let labels = [];
        let dados = [];

        for (let i = 0; i < listaPontuacoes.length; i++) {
            let data = listaPontuacoes[i].dtHora.slice(0, 10);
            labels.push(data);
            dados.push(listaPontuacoes[i].pontuacao);
        }

        new Chart(document.getElementById("graficoQuiz"), {

            type: "bar",

            data: {

                labels: labels,

                datasets: [{
                    label: "Pontuação",
                    data: dados,
                    backgroundColor: "#e36b7c",
                    borderRadius: 12,
                    barThickness: 60
                }]
            },
            options: {

                scales: {

                    y: {
                        beginAtZero: true,
                        max: 10,

                        ticks: {
                            color: "#6a1e53",
                            stepSize: 1
                        },

                        grid: {
                            color: "#f3dce2"
                        }
                    },

                    x: {

                        ticks: {
                            color: "#6a1e53",
                            font: {
                                weight: "bold"
                            }
                        },

                        grid: {
                            display: false
                        }
                    }
                }
            }

        });

    }

    function plotarRanking(rankingUsuarios) {

        let labels = [];
        let dados = [];

        for (let i = 0; i < rankingUsuarios.length; i++) {

            labels.push(rankingUsuarios[i].nome);
            dados.push(rankingUsuarios[i].maiorPontuacao);

        }

        new Chart(document.getElementById("graficoRanking"), {

            type: "bar",

            data: {

                labels: labels,

                datasets: [{
                    label: "Maior Pontuação",
                    data: dados,
                    backgroundColor: "#6a1e53",
                    borderRadius: 12
                }]
            },

            options: {

                scales: {

                    y: {
                        beginAtZero: true,
                        max: 10
                    }
                }
            }
        });
    }

</script>

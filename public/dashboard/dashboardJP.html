<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>別府 | ダッシュボード</title>

    <script src="../js/sessao.js"></script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao(), buscarDados()">

    <header class="header">
        <div class="logo">
            <img src="../assets/img/logo.png">
        </div>

        <div class="right">
            <nav class="menu">
                <a href="../quiJPP.html">クイズ</a>
            </nav>

            <div class="acoes">
                <a class="btn-outline" href="../homeJP.html">戻り</a>
            </div>

            <div class="lang-switch">
                <a href="./dashboard.html">PT</a> |
                <a href="./dashboardJP.html">JP</a>
            </div>
        </div>
    </header>

    <div class="dashboard">

        <h1>
            こんにちは、 <span id="b_usuario"></span>さん　👋
        </h1>

        <div class="kpis">

            <div class="card-kpi">
                <h2>実施したクイズの合計</h2>
                <p id="kpiQuiz">0</p>
            </div>

            <div class="card-kpi">
                <h2>ハイスコア</h2>
                <p id="kpiPontuacao">0</p>
            </div>

            <div class="card-kpi">
                <h2>正解率</h2>
                <p id="kpiMedia">0%</p>
            </div>

            <div class="card-kpi nivel-card" >
                <h2>レベル</h2>
                <p id="perfilNivel">-</p>
            </div>

            <div class="card-kpi titulo-card">
                <h2>称号</h2>
                <p id="perfilTitulo">-</p>
            </div>

        </div>

        <div class="grafico">
            <canvas id="graficoQuiz"></canvas>
        </div>

        <div class="grafico">
            <canvas id="graficoRanking"></canvas>
        </div>

    </div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function buscarDados() {

        fetch(`/quiz/dashboard/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {

                resposta.json().then(function (dados) {

                    console.log(dados);

                    kpiQuiz.innerHTML = dados.totalQuiz;
                    kpiPontuacao.innerHTML = dados.maiorPontuacao;
                    kpiMedia.innerHTML = Number(dados.media).toFixed() + "%";
                    perfilNivel.innerHTML = dados.nivel;
                    perfilTitulo.innerHTML = dados.titulo;

                    plotarGrafico(dados.listaPontuacoes);
                    plotarRanking(dados.rankingUsuarios);

                });

            });

    }

    function plotarGrafico(listaPontuacoes) {

        let labels = [];
        let dados = [];

        for (let i = 0; i < listaPontuacoes.length; i++) {
            labels.push(listaPontuacoes[i].dtHora);
            dados.push(listaPontuacoes[i].pontuacao);
        }

        new Chart(document.getElementById("graficoQuiz"), {

            type: "bar",

            data: {

                labels: labels,

                datasets: [{
                    label: "スコア",
                    data: dados,
                    backgroundColor: "#e36b7c",
                    borderRadius: 12,
                    barThickness: 60
                }]
            },
            options: {

                scales: {

                    y: {
                        beginAtZero: true,
                        max: 14,

                        ticks: {
                            color: "#6a1e53",
                            stepSize: 1
                        },

                        grid: {
                            color: "#f3dce2"
                        }
                    },

                    x: {

                        ticks: {
                            color: "#6a1e53",
                            font: {
                                weight: "bold"
                            }
                        },

                        grid: {
                            display: false
                        }
                    }
                }
            }

        });

    }

    function plotarRanking(rankingUsuarios){

    let labels = [];
    let dados = [];

    for(let i = 0; i < rankingUsuarios.length; i++){

        labels.push(rankingUsuarios[i].nome);
        dados.push(rankingUsuarios[i].maiorPontuacao);

    }

    new Chart(document.getElementById("graficoRanking"), {

        type: "bar",

        data: {

            labels: labels,

            datasets: [{
                label: "ハイスア",
                data: dados,
                backgroundColor: "#6a1e53",
                borderRadius: 12
            }]
        },

        options: {

            scales: {

                y: {
                    beginAtZero: true,
                    max: 14
                }
            }
        }
    });
}

</script>

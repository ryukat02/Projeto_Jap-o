    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
   <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="./indexJP.html"><img src="./assets/img/logo.png" href="/public/index.html"></a>
            </div>
            <div class="header-right">
                <nav class="header-menu">
                    <a href="./indexJP.html#sobre">概要</a>
                    <a href="./indexJP.html#onsens">温泉</a>
                    <a href="./indexJP.html#jigokumushi">地獄むし</a>
                    <a href="./indexJP.html#jigokumeguri">地獄めぐり</a>
                </nav>
                <div class="header-actions">
                    <a class="btn-outline" href="./loginJP.html">ログイン</a>
                    <a class="btn-primary" href="./cadastroJP.html">登録</a>


                    <div class="lang-switch">
                        <a href="./login.html">PT</a> |
                        <a href="./loginJP.html">JP</a>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </header>

    <main class="login-hero">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="login-content">
            <div class="login-card">
                <h2>お帰りなさい!</h2>
                <form>
                    <label>メール:</label>
                    <input id="email_input" type="text" placeholder="メール:">
                    <label>パスワード:</label>
                    <input id="senha_input" type="password" placeholder="******">
                    <div id="div_erros_login"></div>
                </form>

                    <button class="botao" onclick="entrar()">ログイン</button>


                    <div id="div_aguardar" class="loading-div">
                        <img src="./assets/gif/circle-loading.gif" id="loading-gif">
                    </div>
                
            </div>
            
        </div>

    </main>

</body>

</html>

<script>

    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "すべての項目を正しく入力してください!";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                div_erros_login.style.display = "none";

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        window.location = "./homeJP.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    mostrarErroLogin();
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
